name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage thresholds in vitest.config.ts enforce 100% on src/engine —
      # the Phase-1 gate — so this step fails if engine coverage ever drops.
      - name: Test (with engine coverage gate)
        run: npx vitest run --coverage --passWithNoTests

      # Edge functions are excluded from tsc/eslint (Deno runtime, npm: imports).
      # Typecheck them with Deno so the one path touching keys + PII + the LLM
      # can't ship a type error unreviewed.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --config points at supabase/functions/deno.json, which sets
      # nodeModulesDir "none". Without it Deno finds the repo's package.json,
      # switches to node_modules resolution, and fails on every npm: specifier
      # the Expo app doesn't itself install (e.g. the Anthropic SDK).
      # globstar so a future supabase/functions/_shared/**/*.ts is checked too.
      - name: Edge function typecheck + lint
        run: |
          shopt -s globstar
          deno check --config supabase/functions/deno.json supabase/functions/**/*.ts
          deno lint --config supabase/functions/deno.json supabase/functions/
        shell: bash

      # Fails on high/critical. Moderates stay visible in the log; the only
      # current one is uuid<11.1.1 via expo's xcode config plugin — build-time
      # tooling, never in the shipped bundle (see commit history).
      - name: Audit
        run: npm audit --audit-level=high

      # No Supabase key material may ever be committed. JWTs (legacy anon /
      # service keys), sb_secret_ / sb_publishable_ API keys, or a .env file.
      - name: Secret scan
        run: |
          set -e
          PATTERNS='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|sb_secret_[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY=.+[A-Za-z0-9]'
          if git grep -nE "$PATTERNS" -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo '::error::Potential secret committed. Remove it and rotate the key.'
            exit 1
          fi
          if [ -f .env ]; then
            echo '::error::.env is present in the repository. It must never be committed.'
            exit 1
          fi
          echo 'Secret scan clean.'

  # Deploy migrations + edge functions to production, only after `check` passes
  # and only on merge to main. Before this, both were manual from a laptop with
  # no audit trail and no guarantee prod matched main. Requires repo secrets:
  # SUPABASE_ACCESS_TOKEN (a personal access token) and SUPABASE_PROJECT_REF.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: |
          supabase functions deploy resolver-classify
          supabase functions deploy delete-account
          supabase functions deploy revenuecat-webhook
          supabase functions deploy entitlement-refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
