name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage thresholds in vitest.config.ts enforce 100% on src/engine —
      # the Phase-1 gate — so this step fails if engine coverage ever drops.
      - name: Test (with engine coverage gate)
        run: npx vitest run --coverage --passWithNoTests

      # The committed seed SQL must match what the reviewed json generates —
      # otherwise a recipe correction lands in the json and never reaches a
      # database, or worse, hand-edited SQL diverges from the reviewed source.
      - name: Reference seed is in sync with the reviewed json
        run: node scripts/seed-reference.mjs --check

      # Edge functions are excluded from tsc/eslint (Deno runtime, npm: imports).
      # Typecheck them with Deno so the one path touching keys + PII + the LLM
      # can't ship a type error unreviewed.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --config points at supabase/functions/deno.json, which sets
      # nodeModulesDir "none". Without it Deno finds the repo's package.json,
      # switches to node_modules resolution, and fails on every npm: specifier
      # the Expo app doesn't itself install (e.g. the Anthropic SDK).
      # globstar so a future supabase/functions/_shared/**/*.ts is checked too.
      - name: Edge function typecheck + lint
        run: |
          shopt -s globstar
          deno check --config supabase/functions/deno.json supabase/functions/**/*.ts
          deno lint --config supabase/functions/deno.json supabase/functions/
        shell: bash

      # Blocking gate: the tree that can reach a user's phone. Fails on
      # high/critical. Moderates stay visible in the log; the only current one
      # is uuid<11.1.1 via expo's xcode config plugin — build-time tooling,
      # never in the shipped bundle (see commit history).
      - name: Audit (production tree)
        run: npm audit --omit=dev --audit-level=high

      # Informational: the dev tree carries GHSA-mh99-v99m-4gvg
      # (brace-expansion DoS) through eslint's minimatch@3. There is no fixed
      # 1.x or 2.x release, and the fixed 5.x line exports a non-callable CJS
      # object that minimatch@3 cannot use — so it is unfixable here, not
      # unfixed. It runs on our own lint input, never on user data. Printed
      # every run so it stays visible, and re-check it on the next eslint major.
      - name: Audit (dev tree, informational)
        run: npm audit --audit-level=high || true

      # No Supabase key material may ever be committed. JWTs (legacy anon /
      # service keys), sb_secret_ / sb_publishable_ API keys, or a .env file.
      - name: Secret scan
        run: |
          set -e
          PATTERNS='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|sb_secret_[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY=.+[A-Za-z0-9]'
          if git grep -nE "$PATTERNS" -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo '::error::Potential secret committed. Remove it and rotate the key.'
            exit 1
          fi
          if [ -f .env ]; then
            echo '::error::.env is present in the repository. It must never be committed.'
            exit 1
          fi
          echo 'Secret scan clean.'

  # Apply every migration and seed file to a throwaway Supabase Postgres and
  # assert the result. Before this, `supabase db push` on merge to main was the
  # first time any of it met a real schema — auto-applied, against production,
  # with no rollback, and the seed files had never executed at all. The first
  # run of this job found a syntax error in generated seed SQL that would have
  # failed the production deploy.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The image is 3 GB. Skip the job when nothing that touches the database
      # changed — but never skip on main, where the deploy follows.
      - name: Does this change touch the database?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
             | grep -qE '^(supabase/|scripts/(seed|ifct))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No database changes — skipping the migration harness.'
          fi

      - name: Migrations + seed against a real Postgres
        if: steps.scope.outputs.run == 'true'
        run: node scripts/db-migration-test.mjs

  # Deploy migrations + edge functions to production, only after `check` and the
  # migration harness pass, and only on merge to main. Before this, both were
  # manual from a laptop with no audit trail and no guarantee prod matched main.
  # Requires repo secrets: SUPABASE_ACCESS_TOKEN (a personal access token),
  # SUPABASE_PROJECT_REF, and SUPABASE_DB_URL (for the reference seed).
  deploy:
    needs: [check, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Reference data (ingredients, dishes, exercises). `supabase db push`
      # applies migrations only, and a seed file never reaches a remote
      # project — so before this step production had empty ingredients,
      # dishes and exercises, and every food line would have failed to
      # resolve no matter how good the resolver was.
      #
      # All three files are idempotent upserts and are applied in name order,
      # inside a single transaction with ON_ERROR_STOP, so a bad file leaves
      # the tables as they were. Requires the SUPABASE_DB_URL secret (Project
      # Settings → Database → Connection string, session pooler).
      - name: Apply reference seed
        run: |
          for f in supabase/seed/0*.sql; do
            echo "applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy edge functions
        run: |
          supabase functions deploy resolver-classify
          supabase functions deploy delete-account
          supabase functions deploy revenuecat-webhook
          supabase functions deploy entitlement-refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
